services:
  neo4j:
    image: neo4j:5-community
    container_name: journalgraph-neo4j
    ports:
      - "7475:7474"  # Neo4j Browser (mapped to 7475 to avoid conflicts)
      - "7688:7687"  # Bolt protocol (mapped to 7688 to avoid conflicts)
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - journalgraph-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journalgraph-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.docker
      - .env.docker.local
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - journalgraph-network
    command: python main.py

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  backend_logs:
    driver: local

networks:
  journalgraph-network:
    driver: bridge