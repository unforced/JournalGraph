# Development overrides for docker-compose
# This file is automatically used when running docker-compose

services:
  backend:
    # For development, mount the code and use hot reload
    volumes:
      - ./backend:/app
      - /app/venv  # Exclude venv from volume mount
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload